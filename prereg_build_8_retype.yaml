  reader_B: {model: claude-opus-5-5, context: fresh, output: retype/reader_B_1061.yaml and retype/reader_B_1133.yaml}

predictions:
  - {id: P1, says: "the two readers agree on at least 80 percent of rooms on each blueprint (at least 39 of 49 on 1061 including ROOT, at least 28 of 35 on 1133 including ROOT)"}
  - {id: P2, says: "the remaining disagreements are mostly on the estimate/computation boundary: at least half of the disagreeing pairs involve those two types"}
  - {id: P3, says: "the readers agree on every room the planner typed literature_import, and on at least 5 of the 8 rooms the planner typed two_structure_coupling"}
  - {id: P4, says: "reach by consensus v2 type keeps build 6's ordering: computation and case_split above estimate and assembly, all four above coupling and improvement, with literature at zero"}
  - {id: P5, says: "the two readers' type counts differ by at most 6 rooms in any one type on the larger blueprint"}

falsifiers: >
  P1 failing means the written rules did not make the middle reproducible and the type set needs a further revision or
  fewer types before any prior is built on the rates; P4 failing means the build 6 ordering was an artifact of the v1
  labels.

standing_consequences:
  P1_and_P4_hold: "EG7 resolves (resolved_learned); TYPES_V2 becomes the type system of record for the atlas, and the atlas is re-labelled with the consensus types in a following commit"
  P1_fails: "EG7 stays open with the disagreement table as its new data"

