# Pre-registration, cycle "retype-2026-11-27": build 8a, gap EG7, the blind re-typing under revised join types.
# Written 2026-11-27T17:24Z, BEFORE either reader has run. Amendments are appended below a marker line after the
# runs; this registered text is never edited and ends before any amendments key.
#
# Occasion. Build 6's seven join types predicted reach but two readers agreed on them only 85 percent of the time on
# one blueprint and 67 percent on the other, with every disagreement on three boundaries: a computation against a finite
# split, a bound against an averaging step, glue against the identity it glues. A rate built on a type two readers
# cannot reproduce is not a rate. Heidi Bennett (2026-11-27): "Let's execute in that order", EG7 first.
#
# Revision. rooms/TYPES_V2.md: `algebraic_identity` becomes `computation` (equalities, iffs, witnesses, definitional
# facts, and inequalities that hold identically); `extremal_averaging` becomes `estimate` (any inequality whose truth
# needs a size condition); `assembly` requires two or more dependencies and no new inequality, enumeration or
# calculation; `case_split` requires that the enumeration be the content; `literature_import`, `two_structure_coupling`
# and `quantitative_improvement` are unchanged. The types are now walked in a fixed decision order with written tests.
#
# Design. Two fresh reader contexts, one on each of two models (Claude Fable 5.1 and Claude Opus 5.5), each type all 82
# rooms plus the two ROOT entries from the untyped blueprints and TYPES_V2.md alone. Neither sees the planner's types,
# the atlas, the outcomes or the other reader's file. Agreement is scored pairwise per blueprint; reach by type is then
# recomputed on the rooms where the readers agree, using the outcomes already in the atlas.
#
# Caveats before the data. (1) Two readers, two blueprints, one pass; the threshold is the one EG7 wrote, 80 percent
# per blueprint. (2) The readers are models, not mathematicians; agreement between two models under a written rule is
# the thing measured, and a human re-typing would be a separate cycle. (3) Reach by v2 type reuses build 6's
# outcomes, so it is a re-labelling of existing data, not a new measurement of reach. (4) The registrar wrote the rules
# after seeing the build 6 disagreements and may not read as a reader.

mission: rooms-2026-11
cycle: "retype-2026-11-27"
kind: hypothesis
by: "Nervous Machine (Heidi Bennett; Claude Fable 5.1 as registrar and scorer)"
dated: "2026-11-27"
question: >
  Under a type system with a fixed decision order and written boundary rules, do two independent readers agree on the
  join type of at least 80 percent of rooms on each blueprint; where do they still disagree; and does the reach
  ordering of build 6 survive the re-labelling?

