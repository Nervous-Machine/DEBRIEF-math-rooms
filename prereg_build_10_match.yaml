# Pre-registration, cycle "match2-2026-11-27": build 10, the matcher gap EG8. Written 2026-11-27T20:25Z, BEFORE the
# v2 matcher ran on the atlas, before its threshold was computed, and before any registered query ran. Amendments are
# appended below a marker line; this body is never edited.
#
# Occasion. Heidi Bennett (2026-11-27): "Yes, let's do it. EG8." EG8 asks for a semantic feature, a new threshold, the
# same five queries of build 8c and statements from a fifth proof. Build 9b added a second need: the v1 reader splits a
# statement at its top-level colon, so hypotheses written inside the conclusion ("∃ c, … ∧ ∀ G, … → …") are read as
# conclusion, and every hinge written that way had an empty hypothesis side and access 0.
#
# The instrument (rooms/match2.py; rooms/match.py is left as registered for build 8c):
#   - hypotheses read from inside the conclusion: leading ∀/∀ᶠ binders and bounded quantifiers (∀ C > 0) give
#     hypotheses; ∃ binders and the conjuncts before the last give conclusion constraints; a top-level arrow chain puts
#     its antecedents on the hypothesis side, stopping at a nested quantifier; a function-typed binder is not a
#     hypothesis; the planner's `conditionals` field is not used (every statement read the same way);
#   - a semantic feature: the constants a statement uses, IDF-weighted Jaccard, weights over the atlas;
#   - score2 = 0.5 · shape (match.py formula on the new sides) + 0.5 · semantic;
#   - threshold rule tau: for each atlas vector, its best score against vectors of the other targets (569 = the 569
#     blueprint and the 569 statement-only lineage; 159; 1061; 1133); tau = their 95th percentile, nearest rank.
#   rooms/atlas_graph2.py: build 9b's graph, access and shores under the v2 reader and score, neighbourhoods at tau.
#
# Disclosure. Development before this registration: the v2 reader was run on seven hand-written statements, none in the
# atlas and none among the queries, and fixed three times (bounded quantifiers; arrows past a nested quantifier;
# function-typed binders). Both new files were compiled. Nothing else: tau has not been computed, no atlas vector has
# been read by v2, no query has run. The registrar expects P9 and P10 to miss (stated below); they are registered
# because they are the build 9b question the new reader makes testable.

