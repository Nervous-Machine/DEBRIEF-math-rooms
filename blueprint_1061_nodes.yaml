notes: 'Route (Li): the triple 3600(15, 31, 508) has one abundancy, so six distinct primes > 127 on two equations (2.2)-(2.3)
  give a solution (N03-N07). The equations are a split quadric; a rational ruling by skew matrices gives planes, written as
  integer equations OnPl q A B C x (N13-N19). Each plane gets a lattice parametrisation (N21-N23), local admissibility at
  every prime (N34-N40) and a singular-series floor (N41-N42), then Bienvenu''s theorem gives prime points (N45). Denominators
  and parameter triples are counted by a sieve (N25-N31), overlaps are discarded (N32-N33), cores extracted (N47), and coprime
  multipliers summed over shells (N48).

  Hardest provable room: lattice_coords (N23), which needs a Gauss-reduced basis, an exact pullback volume, a box containment
  and an integer bijection together. local_denominator (N38) comes next.

  First type to fail: two_structure_coupling. root_reached is 0 because N01 (Bienvenu Prop. 2.1, via Green-Tao-Ziegler) cannot
  be proved inside the caps and sits under the root. The ROOT entry predicts only the final step, from N48.

  Not in Mathlib: the Green-Tao linear-forms theory, singular series, Gauss reduction of 2-D lattices, and Mertens-type prime
  sums (crude bounds suffice).

