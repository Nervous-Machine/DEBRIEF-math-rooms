notes: |
  Hardest: N45 (plane_prime_count): step 2's example "an analytic estimate against a lattice constraint"
  fits exactly (Bienvenu's estimate applied on the lattice of plane points), so coupling, taken before
  estimate. N40 (beta_local) and N12-style dichotomies: the p|W / p|q split only routes to a dependency,
  so I read it as bookkeeping and typed assembly, not case_split. N23 (lattice_coords): mostly
  parametrisation and volume, but it proves new size-dependent bounds (|c i|, |v j|, threshold C0 q^2 <= T),
  so the boundary rule "applies deps AND proves a new bound" gave estimate. N15: the 15 nonvanishings
  hold only by positivity from Z >= 100, so estimate. Pure counting bounds via injection or union bound
  (N08, N28, N33, N35, N43, N44) typed estimate ("a count, a pigeonhole"); subset monotonicity (N12),
  identities and tables (N03, N14) typed computation. ROOT: one dependency, limit needs x large, estimate.
