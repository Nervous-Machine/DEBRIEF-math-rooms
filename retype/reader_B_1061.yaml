notes: |
  N45 (plane_prime_count): Q2 decided it. The prime count needs Bienvenu's analytic
  estimate against the lattice parametrisation of the plane, and neither alone gives
  it ("analytic estimate against a lattice constraint"). It is not assembly, because
  Q2 comes first in the order.
  N15 (finite_complexity_real): 15 pairwise non-coincidence checks, each closed by a
  sign argument. Case_split, because the enumeration is the content. Its conclusion is
  ≠, not a bound, so it is not estimate.
  N24/N40: N24 applies N16 via N18 and then proves a new product bound, so the boundary
  rule makes it estimate. N40 applies its dependencies across the p|W / p|q / other
  split, so it is case_split, not assembly.
  ROOT has one dependency, so it cannot be assembly. A Tendsto-to-infinity in x is
  estimate.
  Counting inequalities that hold for all parameters (N12, N28, N33, N35, N43) are
  computation, by the identical-inequality rule.
