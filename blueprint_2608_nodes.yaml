notes: 'Parity split (N03). Case A (x odd): z^2 - q^(2b) = p^(2a+1) is a coprime

  factorization of a prime power (N04,N05), giving p^(2a+1) = 2q^b + 1 (N06); mod p forces p = 3

  (N07), then 3^(odd) mod 7 kills both sub-cases (N08-N10, Lemmas 2.3/2.4). Case B (x even):

  q^(2b+1) = (z-p^a)(z+p^a), coprime, so z-p^a = r^n, z+p^a = s^n with rs = q (N12). r = 1 is the

  trivial split: Prop 2.5 via LTE (N02,N13,N14) and Lemma 2.6 (N15) leave (2,1,p+1). r > 1: geometric

  sum identity, Lemma 2.7 gcd, s-r in {1,2}, s-r=2 gives r = 2k-1, p = 2k^2-1 (N17-N24); Remark 2.8

  kills a = b (N25); a = b+1 gives the auxiliary equation, closed by AM-GM bound (6) (N26-N28) and

  the mod-2k^2 argument (8) (N29-N34): k = 2, b = 1 (N36), so p = 7, (4,3,76) (N37).

  Hardest: N37 (nine-node bookkeeping, nat subtraction) and N20 (Lemma 2.7''s

  gcd chain). The binomial truncation (7) has no direct Mathlib form; I replaced it by a generic

  truncated binomial (N30). The paper''s "(2k^2-1)^(b+1) = 1-2(b+1)k^2+4k^4D"

  needs b+1 even, hence N33 before N32. No Mathlib lemma for the pairwise AM-GM on a geometric sum.

  '
