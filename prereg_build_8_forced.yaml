      The registered arm names B8_159none_hold_forced and B8_159none_plain_forced contain the substring "none", and
      rooms/check.sh selects the no-checker regime by `*none*` before it reaches the forced-regime logic; so every
      non-FINAL call in both arms is refused as "no checker in this regime until FINAL". The first arm's searcher found
      this on its first call (17:30:30Z, seq 0001 in results/B8_159none_hold_forced/calls.tsv, refused, not compiled),
      stopped without calling FINAL, and reported it. The second arm had made no call at the time of writing. This is
      the registrar's naming error, not the searchers'.
    change: >
      The two arms rerun under the names B8_blindhold_full_forced and B8_blindplain_full_forced, from the same start
      files (sha256 358ac7d1… and afaae232…), the same forced rooms, allowed rooms and cap, in fresh contexts. The
      instruments are unchanged. The first attempt's directories are kept as a record: the first searcher removed the
      25 `first | proof | sorry` fallbacks from its working copy before being blocked (that copy stays in
      results/B8_159none_hold_forced/work/ and is not an input to the rerun). Predictions P1 to P5 stand as written.
    instrument_note: "check.sh is not changed for this build; a regime name must not contain `none` unless it is a no-checker regime, and the registrar will say so in the tool's header in a later commit"
