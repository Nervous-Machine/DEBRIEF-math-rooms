# Pre-registration, cycle "forced-2026-11-27-none": build 8b, the never-attempted rooms of build 3's two no-checker arms
# under the forced rule. Written 2026-11-27T17:40Z, BEFORE either searcher has run. Amendments are appended below a
# marker line after the runs; this registered text is never edited and ends before any amendments key.
#
# Occasion. EG6 asked which rooms left open without a check call are reachable when forced. Build 4 answered for one
# (Lemma 7: yes, at once) and build 5 for one (the paper's core: no, at 108). Two more sets exist: the rooms that
# build 3's two blind arms on Erdős 159 left open at their first FINAL, apart from the open core. In the hold arm
# three rooms (N10 turan_weak, N16 c4_free_indep_power, N19 floor_succ_le_power) were left open by blind slips or
# not attempted; the same searcher's unscored repair after FINAL closed them, which is recorded but is not data. In
# the plain arm three (N16 c4_free_indep_power, N18 card_le_power_of_c4_free, ROOT erdos_159) were left as sorry.
# All six were proved in the full-feedback arm of build 3, so they are known to be in reach with a checker. The
# question is whether a fresh searcher, made to try each one under the full signal, closes them from these files.
#
# Design. Two arms, fresh contexts, this searcher. Start files: the hold arm's scored final (its first FINAL, which
# carries `first | proof | sorry` fallbacks around every proof) and the plain arm's repaired work file (compiles, four
# sorries). The forced rule now takes several rooms: a call tagged with forced room X is genuine when no sorry sits
# outside the allowed rooms and the other forced rooms; FINAL is refused while any forced room is open with fewer than
# twelve genuine attempts. The open core N13 is allowed to stay open in both arms. The hold file's sorry fallbacks
# count as sorry for the rule, so the searcher must strip them before its first genuine call; this is stated in the
# brief and is itself a measurement (do hedges survive when they cost something).
#
# Caveats before the data. (1) These rooms are in reach by construction (proved under full feedback in build 3); the
# test is of the forced rule on blind slips, not of reach at the frontier. (2) One run per arm. (3) The registrar read
# every earlier arm and may not search.

