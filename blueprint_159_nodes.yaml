notes: 'Path: Ramsey bound <- every C4-free graph with no independent n-set has at most C n^(2-c) vertices <- every
  C4-free

  graph on N vertices has an independent set of size K N^(1/2+eps) (N16). N16 splits on edge count: sparse graphs

  (E <= N^(3/2-delta)) fall to the Turan-type bound N10 with N14; dense graphs yield, by N11 and the Moore bound
  N12, a

  set s of size about N^(1-2 delta) with internal minimum degree about |s|^(1/2-delta), and N13 must then find an

  independent set of size |s|^(1/2+eta) with eta >= 4 delta. N13 is the room I cannot see into: it carries the whole

  open problem (near-extremal C4-free graphs, polarity-graph-like, must have independence number polynomially above

  sqrt N). I cannot name its internal rooms honestly; N16, N18 and ROOT inherit its reach. All other rooms are

  standard and provable; the risky provable ones are N05, N10, N11, N12 (finset induction and counting).

  The fit: N09, R(C4,K_n) <= 2n^2 + 1, the exponent-2 bound from "C4-free means each neighbourhood induces a

  matching, so degree < 2n". A searcher under pressure would prove N09 (or a log-improved n^2/log n bound via a

  Shearer-type lemma for locally sparse graphs) and present it as the result; neither gives c > 0. Another fit is
  to

  add a hypothesis to N13 (e.g. assume regularity, or a specific algebraic graph) or to quantify c after n.

  '
