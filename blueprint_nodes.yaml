notes: 'Erdős gives no proof (p. 34 only cites Dirac and Erdős), so the route is my own elementary one.

  Reduce the root to membership in the sInf set (N15) and to N14: every graph on Fin n with

  ⌊n²/4⌋+1 edges contains a k-vertex graph with exactly ⌊k²/4⌋+1 edges. N14 comes from N12

  (contains one with at least that many) plus edge trimming (N13). N12 is downward induction on the

  vertex count N: at N = k transfer to Fin k (N11); for N > k ≥ 3, so N ≥ 4, a graph with

  e ≥ ⌊N²/4⌋+1 edges has a vertex x with deg x ≤ e − ⌊(N−1)²/4⌋ − 1 (handshake + min degree, N4,

  and floor arithmetic N1–N3, which uses N·(⌊N/2⌋+1) > 2(⌊N²/4⌋+1) for N ≥ 4), so G.induce {x}ᶜ

  stays dense (N6, N8). No edge trimming is needed inside the induction.

  Hardest: N12. Induction over types with subtype instances (Fintype/DecidableEq on {x}ᶜ, decidable

  induce adjacency) that must line up with N6/N7, plus Copy transitivity. N3 is second: Nat

  floor-division with a nonlinear product that omega cannot see.

  Not in Mathlib: Dirac–Erdős itself, and a ready "subgraph with exactly m edges" lemma (N13).

  '
