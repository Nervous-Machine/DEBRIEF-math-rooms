  Q4: {source: rooms/Challenge_1133.lean, what: "erdos_1133, whose own blueprint is excluded so that only the other three proofs can match", exclude: blueprint_1133_nodes.yaml}
  Q5: {source: atlas/hinges.yaml, what: "self-consistency: for every vector, whether its best match among the others is from the same blueprint"}

