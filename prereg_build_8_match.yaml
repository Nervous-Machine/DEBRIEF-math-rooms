# Pre-registration, cycle "match-2026-11-27": build 8c, the statement matcher over the hinge atlas. Written
# 2026-11-27T17:58Z, BEFORE the registered queries below ran. Amendments are appended below a marker line; this body
# is never edited and ends before any amendments key.
#
# Occasion. Heidi Bennett (2026-11-26): can a vector carry a hinge's conditionals so that it can be matched to
# statements? Build 6 wrote the vectors; this cycle builds the first matcher and asks whether shape alone finds the
# right rooms. The matcher is syntactic: it tokenises a statement's binder hypotheses and conclusion, replaces bound
# variable names with a placeholder, and scores Jaccard overlap (0.6 hypotheses, 0.4 conclusion, +0.1 for the same
# conclusion head). It is the filter before any checked subsumption, not the subsumption itself.
#
# Disclosure. During development, before this registration, the registrar ran two things on the atlas: the
# self-consistency measure (best other match from the same blueprint: 143 of 164) and one hand-written query shaped
# like Lemma 7 (which returned cycle_of_closed_seq and lemma7 at the top). Both are recorded here as development, not
# as results; P5 repeats the first as a registered number on the committed atlas.
#
# The atlas at this registration: 164 vectors from four arms (B6_1061_A 49, B6_1133_A 35, B3_569_A 60, B3_159_H_full 20),
# each with its statement, outcome and, where the planner gave one, a join type; regenerated by rooms/hinges.py after
# a change that adds the statement text and the blueprint name to each vector.

