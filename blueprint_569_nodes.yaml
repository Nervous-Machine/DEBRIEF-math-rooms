notes: 'Route (paper''s): strong induction on m (N59) with k fixed. m=0 and m=1 are base cases (N09, N11).

  Disconnected H splits at a closed vertex set and glues two inductive copies (N41-N45). Connected H:

  k=3 is Theorem 1 (N14); k in {4,5,6} is Lemma 4 (N29) from Jayawardene''s three bounds and four small

  Ramsey numbers (N22-N28); k>=7 (N58): delete a min-degree vertex u, extend the inductive copy or find a

  red star (N46-N50). Degree 1: Corollary 6 in the star (N51). Degree >=2 (N57): blue clique U1 in S

  (N52-N53), Gamma bounded by Lemma 7 and Lemma 5 (N30-N33, N54), sparse half T by averaging (N37-N39),

  U2 bounded by the IH padded for isolated vertices (N40, N55), contradiction by arithmetic with

  Proposition 10 (N34-N36, N56) unless n=3, handled by Theorem 1 swapped (N15). Lemma 5 uses Häggkvist in

  "parts" form (N16-N20).

  Hardest: the literature rooms. R(C6,K5)<=21 (N28) and Jayawardene''s thesis bounds have no short proof and

  are far beyond brute force; Goddard-Kleitman (N14) is a multi-page argument, so the root is almost

  surely not reached sorry-free. Among the paper''s own steps, N57 is the heaviest join.

  Not in Mathlib: graph Ramsey numbers, Häggkvist, Theorem 1, critical subgraphs.

  '
