notes: 'Route (paper, Sections 3-4, specialised to ρ = 0 at the end): Olevskii–Ulanovskii''s finite Bernstein-space

  bound (N01) plus rescaling and a real/complex split give Lemma 3.2 (N12): an even k ≤ e^{A0(1+H)} such that every

  k-tuple in an interval of length k+1 carries unit real data with no B_π interpolant of norm ≤ H. Convex separation

  of the closed convex sample set (N03, N14, N15, N16) turns this into sign data (Lemma 3.3, N17). The angular

  substitution P(cos(πz/D)) (N19-N23) sends admissible polynomials into B_π; grouping angular nodes into disjoint

  k-groups in intervals of length k+1 (N24-N27) and counting one error per group (N28) gives Theorem 4.1 (N29);

  ε = 1/(8k²), n0 = 4k² gives Theorem 2.1 (N32); ρ = 0 and complement counting give the root.

  Hardest: N29 and N25/N27, re-indexing Finset groups as Fin k tuples and bucket bookkeeping; mathematically the

  wall is N01 (and N03), left as imports. ROOT reached 0.7 is the root step from the nodes; root_reached counts the

  imports, which will stay sorry. Expect two_structure_coupling (N17) or N25 to fail first. Not in Mathlib: Bernstein

  spaces, Montel/normal families, a ready |cos w| ≤ e^{|Im w|} lemma.

