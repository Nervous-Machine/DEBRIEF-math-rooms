  B7_569_full_incentive:  {model: claude-fable-5-1, start_file: {path: results/B3_569_B_full_noplan_hold/final.lean, sha256: "c60fd0551651b91038d14ce505a0519e9d808c8ec31ec31e7b9af1592798003d"}, open_at_start: [core_ge_three_nonstar], brief: rooms/SEARCHER_INCENTIVE_PROMPT.md, check_returns: "Lean's complete output", nodes_for_scoring: start_569B_nodes.yaml}
  B7_159_full_incentive:  {model: claude-fable-5-1, start_file: {path: results/B3_159_H_full_hold/final.lean, sha256: "44c42855fd351865fe7d95d8e77a25088eb71ec09214f764358db4e7dd255519"}, open_at_start: [core_near_extremal], brief: rooms/SEARCHER_INCENTIVE_PROMPT.md, check_returns: "Lean's complete output", nodes_for_scoring: start_159H_nodes.yaml}
  B7_159_none_plain_opus: {model: claude-opus-5-5, inputs: [Challenge_159.lean, blueprint_159_nodes.yaml, mathlib source], brief: rooms/SEARCHER_PLAIN_PROMPT.md, check_returns: "nothing until FINAL", note: "build 3's B3_159_H_none_plain arm with the other model; no sorry allowed by the brief, no hold rule, no checker"}

prior:
  mathlib: {commit: "ccbef15ebdb41c2addfac682131f83c75904c3c1", lean: "v4.35.0"}
